# Build and publish the tavern docker image for pull requests so they can be
# tested in Coder (see the "Test in Coder" button in the PR template).
#
# Mirrors the production build in docker-dev.yml, but:
# - publishes to GHCR only, using GITHUB_TOKEN. Docker Hub credentials are
#   deliberately not used here; they stay restricted to main and releases.
# - tags images pr-<head sha> (the Coder template prepends `pr-` to
#   realm_image_sha) plus pr-<number>-<head sha>, which docker-pr-cleanup.yml
#   uses to delete a PR's images once it closes.
# - only runs for PRs from branches in spellshift/realm. Fork PRs, Dependabot
#   PRs, and runs inside contributors' own forks are skipped.

name: Publish Docker Images (on pull request)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}/tavern
  # Make type=sha (and the OCI revision label) use the PR head sha, not the merge commit
  DOCKER_METADATA_PR_HEAD_SHA: 'true'

jobs:
  tavern-docker:
    # github.actor is whoever triggered the run, so also check the PR author to
    # catch Dependabot PRs reopened or re-run by a maintainer.
    if: >-
      github.repository == 'spellshift/realm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: 'true'
      - name: Replace lfs references with files
        run: git lfs pull
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=pr-
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: ./docker/tavern.Dockerfile
          context: .
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push a single image manifest (no attestation index) so the cleanup
          # workflow can delete each PR image as one package version.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
