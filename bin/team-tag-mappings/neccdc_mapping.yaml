---
# Team tag mapping for create_tags.py (usage: create_tags.py <tavern_url> <mapping.yaml> [--overwrite]).
# Converted from neccdc_mapping.py. Each entry defines a tag `name`, its `kind`
# (group or service), and a `where` clause using HostWhereInput fields.
# Rules apply in file order; a host carrying a tag of the rule's kind is
# skipped unless --overwrite is given.
#
# Translation notes (regex -> HostWhereInput):
# - Only `primaryIP` is matched; the old `externalIP` fallback was dropped.
# - `^10\.0\.[0-9]{1,2}\.LAST$` becomes a prefix+suffix `and`. The leading dot
#   in the suffix makes it exact: for valid IPv4 addresses, ending in ".LAST"
#   holds exactly when the final octet is LAST.
# - `^10\.0\.N\.[0-9]{1,3}$` becomes `primaryIPHasPrefix: "10.0.N."`.
# - `^hostname$` becomes `name: hostname`.
# - One known widening: the old `10.0.[0-9]{1,2}.LAST` patterns excluded
#   3-digit middle octets (e.g. 10.0.100.132); the prefix form matches them.
#   Team numbers here are 1-20, so this has no practical effect.

# Services
- name: idm
  kind: service
  where:
    and:
      - primaryIPHasPrefix: "10.0."
      - primaryIPHasSuffix: ".132"
- name: controller
  kind: service
  where:
    name: controller
