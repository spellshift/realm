[package]
name = "eldritch-wasm"
version = "0.4.1"
edition = "2024"

[features]
default = ["fake_bindings"]
stdlib = ["eldritch/stdlib", "eldritch/std"]
fake_bindings = ["eldritch/fake_bindings"]

[[bin]]
name = "eldritch"
path = "bin/repl.rs"
required-features = ["stdlib"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.27"
eldritch = { path = "../eldritch", default-features = false, features = [
    "std",
    "stdlib",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.5.0", features = ["js"] }
eldritch = { path = "../eldritch", default-features = false, features = [
    "fake_bindings",
] }

[dependencies]
eldritch-core = { path = "../eldritch-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.87"
eldritch-repl = { path = "../eldritch-repl", default-features = false }
spin = { version = "0.10.0", features = ["rwlock"] }
log = "0.4"
wasm-bindgen = "0.2"

[dev-dependencies]
criterion = "0.5"
