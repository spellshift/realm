[package]
name = "eldritch-libfile"
version = "0.4.1"
edition = "2024"

[features]
default = ["stdlib"]
stdlib = [
    "dep:eldritch-libgzip",
    "eldritch-libgzip/stdlib",
    "eldritch-libtemplate/stdlib",
    "eldritch-libprocess/stdlib",
    "dep:tempfile",
    "dep:glob",
    "dep:regex",
    "dep:anyhow",
    "dep:notify",
    "dep:jiff",
    "dep:which",
]
fake_bindings = [
    "dep:eldritch-libgzip",
    "eldritch-libgzip/fake_bindings",
    "eldritch-libtemplate/fake_bindings",
    "eldritch-libprocess/fake_bindings",
]

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
eldritch-libgzip = { path = "../eldritch-libgzip", default-features = false, optional = true }
eldritch-libtemplate = { workspace = true, default-features = false }
eldritch-libprocess = { workspace = true, default-features = false }
tempfile = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
which = { workspace = true, optional = true }
spin = { version = "0.10.0", features = ["mutex", "spin_mutex"] }

[target.'cfg(all(unix, not(target_os = "solaris")))'.dependencies]
nix = { workspace = true, features = ["user", "fs"] }

[target.'cfg(target_os = "solaris")'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
] }
