[package]
name = "eldritch-libpivot"
version = "0.4.1"
edition = "2024"

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
eldritch-agent = { workspace = true, optional = true }
eldritch-libnet = { path = "../eldritch-libnet", default-features = false }
eldritch-libportal = { path = "../eldritch-libportal", default-features = false }
eldritch-libscan = { path = "../eldritch-libscan", default-features = false }
eldritch-libssh = { path = "../eldritch-libssh", default-features = false }
pb = { workspace = true, optional = true }

[dev-dependencies]
eldritch-mockagent = { path = "../../testutils/eldritch-mockagent" }
tempfile = { workspace = true }
eldritch-agent = { workspace = true }

[features]
default = ["stdlib"]
stdlib = [
    "dep:eldritch-agent",
    "dep:pb",
    "eldritch-libnet/stdlib",
    "eldritch-libportal/stdlib",
    "eldritch-libscan/stdlib",
    "eldritch-libssh/stdlib",
]
fake_bindings = [
    "eldritch-libnet/fake_bindings",
    "eldritch-libportal/fake_bindings",
    "eldritch-libscan/fake_bindings",
    "eldritch-libssh/fake_bindings",
]
print_debug = ["eldritch-libscan/print_debug"]

