[package]
name = "eldritch-libreport"
version = "0.4.2"
edition = "2024"

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
eldritch-agent = { workspace = true, optional = true }
pb = { workspace = true, optional = true }
spin = { version = "0.10.0", features = ["rwlock"] }
glob = { workspace = true }
log = { workspace = true }

[target.'cfg(any(target_os="linux", target_os="macos"))'.dependencies]
nix = { workspace = true, optional = true }

[target.'cfg(target_os="linux")'.dependencies]
drm = { workspace = true, version="0.14", optional=true }
memmap2 = { workspace=true, version="0.9", optional=true }
image = { workspace=true, version = "0.25", default-features = false, features = ["png"], optional=true }
framebuffer = { workspace=true, version="0.3", optional=true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = { workspace = true, optional = true }
image = { version = "0.25", optional = true }

[features]
default = ["stdlib"]
stdlib = ["dep:pb", "dep:eldritch-agent", "dep:nix", "dep:xcap", "dep:image", "dep:memmap2", "dep:framebuffer", "dep:drm"]
fake_bindings = []

[dev-dependencies]
eldritch-libprocess = { path = "../eldritch-libprocess" }
