[package]
name = "eldritch-libsys"
version = "0.4.1"
edition = "2024"

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
eldritch-libfile = { path = "../eldritch-libfile", default-features = false }
eldritch-libnet = { path = "../eldritch-libnet", default-features = false }
eldritch-libprocess = { path = "../eldritch-libprocess", default-features = false }
eldritch-libuser = { path = "../eldritch-libuser", default-features = false }
eldritch-libwindows = { path = "../eldritch-libwindows", default-features = false }
anyhow = { workspace = true }
whoami = { workspace = true, optional = true }
spin = { version = "0.10.0", features = ["mutex", "spin_mutex"] }

[target.'cfg(all(unix, not(target_os = "solaris")))'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_System_Environment",
] }

[features]
default = ["stdlib"]
stdlib = [
    "dep:whoami",
    "eldritch-libfile/stdlib",
    "eldritch-libnet/stdlib",
    "eldritch-libprocess/stdlib",
    "eldritch-libuser/stdlib",
    "eldritch-libwindows/stdlib",
]
fake_bindings = [
    "eldritch-libfile/fake_bindings",
    "eldritch-libnet/fake_bindings",
    "eldritch-libprocess/fake_bindings",
    "eldritch-libuser/fake_bindings",
    "eldritch-libwindows/fake_bindings",
]

[dev-dependencies]
tempfile = { workspace = true }

