[package]
name = "eldritch-libtemplate"
version = "0.4.1"
edition = "2024"

[features]
default = ["stdlib"]
stdlib = ["dep:tera", "dep:anyhow", "dep:serde_json"]
fake_bindings = []

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
tera = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
