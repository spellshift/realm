[package]
name = "eldritch-libtime"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eldritch-core = { workspace = true }
eldritch-macros = { workspace = true }
jiff = { workspace = true, optional = true }
anyhow = { version = "1.0", optional = true }

[features]
default = ["stdlib"]
stdlib = ["dep:jiff", "dep:anyhow"]
fake_bindings = []
