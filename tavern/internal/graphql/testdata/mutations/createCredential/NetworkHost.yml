requestor:
  session_token: secretToken
query: |
  mutation CreateCredentialForNetworkHost($input: CreateHostCredentialInput!) {
    createCredential(input: $input) {
      principal
      secret
      kind
      host {
        id
      }
      networkHosts {
        edges {
          node {
            id
            name
            ipAddress
          }
        }
      }
    }
  }
