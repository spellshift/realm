query: |
  mutation CreateNetworkHost($input: CreateNetworkHostInput!) {
    createNetworkHost(input: $input) {
      id
      name
      hostname
      ipAddress
      subnet
      openPorts
      host {
        id
        name
      }
      networks {
        edges {
          node {
            id
            name
            subnet
          }
        }
      }
    }
  }
