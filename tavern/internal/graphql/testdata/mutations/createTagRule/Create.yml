state: |
  INSERT INTO `users` (id,oauth_id,photo_url,name,session_token,access_token,is_activated,is_admin)
    VALUES (5,"test_oauth_id","https://photos.com","test","secretToken","accessToken",true,true);
  INSERT INTO `tags` (id, name, kind)
    VALUES (4000,"auto-group","group");
requestor:
  session_token: secretToken
query: |
  mutation CreateTagRule($input: CreateTagRuleInput!) {
    createTagRule(input: $input) {
      priority
      order
      conditions
      tag {
        id
        name
        kind
      }
    }
  }
variables:
  input:
    tagID: 4000
    priority: 5
    conditions:
      - field: platform
        predicate: is
        values:
          - PLATFORM_LINUX
expected:
  createTagRule:
    priority: 5
    order: 5
    conditions: '[{"field":"platform","predicate":"is","values":["PLATFORM_LINUX"]}]'
    tag:
      id: "4000"
      name: auto-group
      kind: group
