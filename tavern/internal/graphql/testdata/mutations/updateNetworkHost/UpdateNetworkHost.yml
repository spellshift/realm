query: |
  mutation UpdateNetworkHost($networkHostID: ID!, $input: UpdateNetworkHostInput!) {
    updateNetworkHost(networkHostID: $networkHostID, input: $input) {
      id
      name
      hostname
      ipAddress
      subnet
      openPorts
      credentials {
        edges {
          node {
            id
            principal
            kind
          }
        }
      }
    }
  }
