requestor:
  session_token: secretToken
query: |
  mutation UpdateOperatorNote($operatorNoteID: ID!, $input: UpdateOperatorNoteInput!) {
    updateOperatorNote(operatorNoteID: $operatorNoteID, input: $input) {
      id
      content
      author {
        id
        name
      }
      shells {
        edges {
          node {
            id
          }
        }
      }
    }
  }
