syntax = "proto3";
// edition = "2024";

package portal;

option go_package = "realm.pub/tavern/portals/portalpb";

enum BytesPayloadKind {
    BYTES_PAYLOAD_KIND_UNSPECIFIED = 0;
    BYTES_PAYLOAD_KIND_DATA = 1;
    BYTES_PAYLOAD_KIND_PING = 2;
    BYTES_PAYLOAD_KIND_KEEPALIVE = 3;
    BYTES_PAYLOAD_KIND_TRACE = 4;
    BYTES_PAYLOAD_KIND_CLOSE = 5;
    BYTES_PAYLOAD_KIND_PTY = 6;
}
message BytesPayload {
    bytes data = 1;
    BytesPayloadKind kind = 2;
    uint32 rows = 3;
    uint32 cols = 4;
}
message TCPPayload {
    bytes data = 1;
    string dst_addr = 2;
    uint32 dst_port = 3;
}
message UDPPayload {
    bytes data = 1;
    string dst_addr = 2;
    uint32 dst_port = 3;
}
message ShellPayload {
    string input = 1;
    int64 shell_id = 2;
    string output = 3;
    string error = 4;
}

enum SSHPayloadKind {
    SSH_PAYLOAD_KIND_UNSPECIFIED = 0;
    SSH_PAYLOAD_KIND_CONNECT = 1;
    SSH_PAYLOAD_KIND_DATA = 2;
    SSH_PAYLOAD_KIND_RESIZE = 3;
    SSH_PAYLOAD_KIND_CLOSE = 4;
}

message SSHPayload {
    SSHPayloadKind kind = 1;
    string dst_addr = 2;
    uint32 dst_port = 3;
    string username = 4;
    string password = 5;
    bytes private_key = 6;
    uint32 rows = 7;
    uint32 cols = 8;
    bytes data = 9;
}

message Mote {
    // Unique identifier used to route reply traffic back to original port
    string stream_id = 1;

    // Ordered number for clients to reassemble an ordered stream
    uint64 seq_id = 2;

    // A payload
    oneof payload {
        UDPPayload udp = 3;
        TCPPayload tcp = 4;
        BytesPayload bytes = 5;
        ShellPayload shell = 6;
        SSHPayload ssh = 7;
    }
}

message OpenPortalRequest {
    int64 portal_id = 1;
    Mote mote = 2;
}
message OpenPortalResponse {
    Mote mote = 2;
}

/*
 * Service
 */

service Portal {
    rpc OpenPortal(stream OpenPortalRequest) returns (stream OpenPortalResponse) {}
}
